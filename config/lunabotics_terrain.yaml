# Semi-dynamic terrain map for Lunabotics (scripts/terrain_mapper.py).
# Grid is fixed in the SLAM map frame (origin = where the camera started; z up,
# gravity-aligned). Size it to cover the arena from the start pose.

terrain_mapper:
  ros__parameters:
    cloud_topic: /lidar/points            # projector-on dense depth from the fusion pipeline
    map_frame: map
    update_rate: 5.0                      # Hz; ~4 ms per update for a 25k-point cloud

    resolution: 0.05                      # m per cell
    size_x: 12.0                          # m
    size_y: 12.0                          # m
    origin_x: 0.0                         # grid centre in the map frame
    origin_y: 0.0

    min_range: 0.3                        # m
    max_range: 3.5                        # m; D455 depth noise grows with range^2
    sigma_a: 0.005                        # height noise sigma = a + b * range^2 (m)
    sigma_b: 0.005                        #   ~1 cm at 1 m, ~6 cm at 3 m

    change_threshold: 3.0                 # sigmas: beyond this a cell is "dug/dumped" and reset
    cleanup_margin: 0.05                  # m: clear cells the camera sees >5 cm *through*
    time_variance: 0.00001                # m^2/s added to unobserved cells (map keeps adapting)
    max_variance: 0.05                    # m^2
    min_change: 0.03                      # m: smaller height changes don't count as volume

    save_path: ~/.ros/lunabotics_terrain.npz   # written on shutdown (launch arg terrain_file overrides)
    load: false                           # true: start from the saved terrain + baseline
