# D455 "simulated 3D LiDAR" mapping settings (ROS 2 parameter file).
#
# The D455 depth stream is converted to a point cloud and treated like a 3D LiDAR
# scan: ICP odometry (with IMU prior) + RTAB-Map scan-based SLAM, following
# rtabmap_examples/lidar3d.launch.py. No visual features are used.
#
# RTAB-Map's own parameters ("Group/Name") must be quoted strings.

camera:                                   # realsense2_camera_node
  ros__parameters:
    # Depth only. IR projector ON: its dot pattern gives dense depth on blank
    # surfaces (it's off in the visual mode because it breaks feature tracking).
    enable_color: false
    enable_infra1: false
    enable_infra2: false
    enable_depth: true
    depth_module.depth_profile: "848,480,30"   # D455's most accurate depth mode
    depth_module.emitter_enabled: 1
    depth_module.enable_auto_exposure: true

    # Built-in BMI055 IMU, merged into one /camera/imu topic.
    enable_gyro: true
    enable_accel: true
    gyro_fps: 200
    accel_fps: 200
    unite_imu_method: 2

imu_filter_madgwick:                      # gyro + accel -> orientation on /imu/data
  ros__parameters:
    use_mag: false
    world_frame: enu
    publish_tf: false

point_cloud_xyz:                          # depth image -> "LiDAR scan" (/lidar/points)
  ros__parameters:
    approx_sync: false
    decimation: 4                         # 848x480 -> 212x120 before projecting
    voxel_size: 0.05                      # m, like a LiDAR's point spacing
    min_depth: 0.3                        # m
    max_depth: 6.0                        # m; D455 depth error ~2% at 4 m, grows with range^2
    filter_nans: true

imu_to_tf:                                # IMU orientation -> camera_link_stabilized frame (ICP guess)
  ros__parameters:
    fixed_frame_id: camera_link_stabilized
    base_frame_id: camera_link
    wait_for_transform_duration: 0.001

icp_odometry:                             # rtabmap_odom, scan-to-map ICP
  ros__parameters:
    frame_id: camera_link
    odom_frame_id: odom
    guess_frame_id: camera_link_stabilized
    wait_imu_to_init: true
    expected_update_rate: 35.0            # Hz, slightly above the 30 Hz depth rate
    deskewing: false                      # depth frames are a single global-shutter exposure

    Odom/ResetCountdown: "5"
    Odom/ScanKeyFrameThr: "0.4"
    OdomF2M/ScanSubtractRadius: "0.05"
    OdomF2M/ScanMaxSize: "15000"
    OdomF2M/BundleAdjustment: "false"
    Icp/PointToPlane: "true"
    Icp/Iterations: "10"
    Icp/VoxelSize: "0.05"
    Icp/Epsilon: "0.001"
    Icp/PointToPlaneK: "20"
    Icp/PointToPlaneRadius: "0"
    Icp/MaxTranslation: "1"
    Icp/MaxCorrespondenceDistance: "0.5"
    Icp/Strategy: "1"                     # libpointmatcher
    Icp/OutlierRatio: "0.7"
    Icp/CorrespondenceRatio: "0.01"

rtabmap:                                  # rtabmap_slam on scan clouds
  ros__parameters:
    frame_id: camera_link
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_stereo: false
    subscribe_scan_cloud: true
    subscribe_odom_info: true
    approx_sync: false

    Rtabmap/DetectionRate: "3"            # Hz
    RGBD/LinearUpdate: "0.05"             # m
    RGBD/AngularUpdate: "0.05"            # rad
    RGBD/ProximityMaxGraphDepth: "0"      # no images -> loop closures come from scan proximity
    RGBD/ProximityPathMaxNeighbors: "1"
    Mem/NotLinkedNodesKept: "false"
    Mem/STMSize: "30"
    Reg/Strategy: "1"                     # ICP registration for loop closures

    Icp/PointToPlane: "true"
    Icp/Iterations: "10"
    Icp/VoxelSize: "0.05"
    Icp/Epsilon: "0.001"
    Icp/PointToPlaneK: "20"
    Icp/PointToPlaneRadius: "0"
    Icp/MaxTranslation: "3"
    Icp/MaxCorrespondenceDistance: "0.5"
    Icp/Strategy: "1"
    Icp/OutlierRatio: "0.7"
    Icp/CorrespondenceRatio: "0.2"        # min scan overlap to accept a loop closure

    # Build /cloud_map from the scans themselves (like a LiDAR map).
    RGBD/CreateOccupancyGrid: "true"
    Grid/Sensor: "0"                      # 0 = scans
    Grid/3D: "true"
    Grid/CellSize: "0.05"
    Grid/RangeMax: "6.0"
