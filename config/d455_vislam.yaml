# D455 stereo VISLAM settings (ROS 2 parameter file).
#
# Every tunable lives here; the launch file only handles modes and topic wiring.
# To keep variants (e.g. a dim room), copy this file and run:
#   ./run.sh config:=config/my_room.yaml
#
# RTAB-Map's own parameters ("Group/Name") must be quoted strings.

camera:                                   # realsense2_camera_node
  ros__parameters:
    # Stereo pair only: left/right IR, hardware-synced. Colour and depth unused.
    enable_color: false
    enable_depth: false
    enable_infra1: true
    enable_infra2: true
    depth_module.infra_profile: "848,480,30"
    enable_sync: true

    # IR projector off: its dot pattern moves with the camera and corrupts tracking.
    depth_module.emitter_enabled: 0

    # Short fixed exposure. Auto-exposure picks 15-20 ms indoors with the projector
    # off, which motion-blurs features and loses tracking (and the firmware ignores
    # depth_module.auto_exposure_limit). Raise gain (16-248) in dim rooms, ~160.
    depth_module.enable_auto_exposure: false
    depth_module.exposure: 5000           # microseconds
    depth_module.gain: 64

    # Built-in BMI055 IMU, merged into one /camera/imu topic.
    enable_gyro: true
    enable_accel: true
    gyro_fps: 200
    accel_fps: 200
    unite_imu_method: 2                   # 0=none, 1=copy, 2=linear interpolation

imu_filter_madgwick:                      # gyro + accel -> orientation on /imu/data
  ros__parameters:
    use_mag: false
    world_frame: enu
    publish_tf: false

stereo_odometry:                          # rtabmap_odom
  ros__parameters:
    frame_id: camera_link                 # robot frame; base_link once camera TF is published
    approx_sync: false                    # IR pair is hardware-synced
    wait_imu_to_init: true                # start gravity-aligned

    # Re-initialize after 5 consecutive failed frames (~0.3 s) instead of staying lost
    # forever. Not 1: every reset starts a new rtabmap session and the shown map jumps
    # until a loop closure re-links it; brief dropouts recover on their own.
    Odom/ResetCountdown: "5"
    # Fewer features: ~35-39 ms/frame instead of ~52 ms, still ~150 inliers.
    Vis/MaxFeatures: "500"
    OdomF2M/MaxSize: "1500"

rtabmap:                                  # rtabmap_slam (mapping and localization)
  ros__parameters:
    frame_id: camera_link
    subscribe_stereo: true
    subscribe_odom_info: true
    approx_sync: false

    # Map update rate and how far the camera must move before adding a keyframe.
    Rtabmap/DetectionRate: "3"            # Hz
    RGBD/LinearUpdate: "0.05"              # m
    RGBD/AngularUpdate: "0.05"             # rad

    # Cleaner dense map from the stereo pair: SGBM disparity, short range (stereo
    # depth error grows with distance^2), 3 cm voxels, outlier removal.
    Stereo/DenseStrategy: "1"
    Grid/RangeMax: "4.0"
    Grid/CellSize: "0.03"
    Grid/NoiseFilteringRadius: "0.1"
    Grid/NoiseFilteringMinNeighbors: "8"

    # Static map. dynamic_map:=true overrides these from config/dynamic_map.yaml.
    Grid/RayTracing: "false"
    GridGlobal/ProbMiss: "0.4"

rtabmap_viz:                              # only with rtabmap_viz:=true
  ros__parameters:
    frame_id: camera_link
    subscribe_stereo: true
    subscribe_odom_info: true
    approx_sync: false
    odometry_node_name: stereo_odometry
