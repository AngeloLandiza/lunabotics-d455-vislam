# D455 colour 3D reconstruction: RGB-D SLAM whose keyframes keep the colour image and the
# depth aligned to it, so the saved map exports as a textured mesh / coloured point cloud
# (run/physical/reconstruct.sh does the export on exit, via run/export_mesh.sh).
#
# Unlike the other modes the IR projector stays on: tracking runs on the colour camera
# (its IR-cut filter hides the dots), and every depth frame gets the projector's texture.
#
# RTAB-Map's own parameters ("Group/Name") must be quoted strings.

camera:                                   # realsense2_camera_node
  ros__parameters:
    enable_color: true
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    rgb_camera.color_profile: "848,480,30"
    depth_module.depth_profile: "848,480,30"
    align_depth.enable: true              # depth reprojected into the colour camera
    enable_sync: true

    depth_module.emitter_enabled: 1       # projector always on: densest depth

    # Colour auto-exposure, but never longer than a frame (keeps 30 Hz; long exposures
    # motion-blur the keyframes and the texture). Move slowly in dim rooms.
    rgb_camera.enable_auto_exposure: true
    rgb_camera.auto_exposure_priority: false
    depth_module.enable_auto_exposure: true

    enable_gyro: true
    enable_accel: true
    gyro_fps: 200
    accel_fps: 200
    unite_imu_method: 2

imu_filter_madgwick:
  ros__parameters:
    use_mag: false
    world_frame: enu
    publish_tf: false

rgbd_odometry:                            # visual-inertial odometry on colour + aligned depth
  ros__parameters:
    frame_id: camera_link
    approx_sync: false                    # aligned depth carries the colour frame's stamp
    wait_imu_to_init: true
    Odom/ResetCountdown: "5"

rtabmap:
  ros__parameters:
    frame_id: camera_link
    subscribe_depth: true
    subscribe_odom_info: true
    approx_sync: false

    # More keyframes than the navigation modes: each one is a texture source, and
    # overlapping views fill holes in the mesh.
    Rtabmap/DetectionRate: "2"            # Hz
    RGBD/LinearUpdate: "0.05"             # m
    RGBD/AngularUpdate: "0.05"            # rad

    # Live coloured map in RViz (the export re-creates it at full density).
    RGBD/CreateOccupancyGrid: "true"
    Grid/Sensor: "1"                      # 1 = depth image
    Grid/3D: "true"
    Grid/CellSize: "0.02"
    Grid/RangeMax: "4.0"                  # D455 depth error ~2% of range: beyond 4 m it smears
    Grid/DepthDecimation: "2"
    Grid/NoiseFilteringRadius: "0.1"
    Grid/NoiseFilteringMinNeighbors: "5"
